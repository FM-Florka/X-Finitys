name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xlines-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # --- Release (signed) — secrets only via env (not step if:); skip if unset ---
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # secrets.* is invalid in step `if:` — gate here instead
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — skip release build"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/xlines-release.jks"
          # never echo secret / raw base64
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          echo "path=${KEYSTORE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Keystore decoded OK ($(wc -c < "${KEYSTORE_PATH}") bytes)"

      - name: Build Release APK (signed)
        if: steps.keystore.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xlines-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Cleanup keystore
        if: always() && steps.keystore.outputs.ready == 'true'
        run: |
          rm -f "${{ steps.keystore.outputs.path }}"
          echo "Keystore removed from runner"
